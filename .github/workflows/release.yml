name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }} release binary
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
          - platform: ARM64

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@fcef4f8d7f1b546a7a89e33d70f4d11fa0482a6b # v2.0.0

      - name: Build release binary
        run: msbuild syncwingetlink.sln -m:1 /nr:false -p:Configuration=Release -p:Platform=${{ matrix.platform }}

      - name: Stage release asset
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $source = Join-Path $PWD "build\${{ matrix.platform }}\Release\syncwingetlink.exe"
          $target = Join-Path $PWD "syncwingetlink-$version-${{ matrix.platform }}.exe"
          Copy-Item -Path $source -Destination $target -Force

          $sha = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $([System.IO.Path]::GetFileName($target))" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii -Append

      - name: Upload release artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: syncwingetlink-${{ matrix.platform }}
          path: |
            syncwingetlink-*.exe
            SHA256SUMS.txt

  publish:
    name: Publish draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@7a1cd3216ca9260cd8022db641d960b1db4d1be4
        with:
          path: release-artifacts

      - name: Publish draft release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-artifacts/**/syncwingetlink-*.exe
            release-artifacts/**/SHA256SUMS.txt
