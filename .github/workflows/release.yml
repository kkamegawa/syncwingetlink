name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} release binary
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-latest
          - platform: ARM64
            # docs/adr-phase-9.md ADR-0046: matches ci.yml's ARM64 runner choice - the
            # only hosted image with PlatformToolset v145 (VS2026) on arm64.
            runner: windows-11-vs2026-arm

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build release binary
        run: msbuild syncwingetlink.sln -m:1 /nr:false -p:Configuration=Release -p:Platform=${{ matrix.platform }}

      - name: Stage release asset
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $assetArch = "${{ matrix.platform }}".ToLowerInvariant()

          $stage = Join-Path $PWD "stage"
          $stageDocs = Join-Path $stage "docs"
          New-Item -ItemType Directory -Force -Path $stageDocs | Out-Null

          $source = Join-Path $PWD "build\${{ matrix.platform }}\Release\syncwingetlink.exe"
          Copy-Item -Path $source -Destination (Join-Path $stage "syncwingetlink.exe") -Force

          $docs = @(
            "README.md",
            "README_ja.md",
            "docs\rules.md",
            "docs\rules_ja.md",
            "docs\troubleshooting.md",
            "docs\troubleshooting_ja.md"
          )
          foreach ($doc in $docs) {
            if (-not (Test-Path -LiteralPath $doc)) {
              throw "Release doc not found: $doc"
            }
            Copy-Item -LiteralPath $doc -Destination $stageDocs -Force
          }

          $zipName = "syncwingetlink-$version-$assetArch.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipName -Force

          # Out-File always writes CRLF on Windows even with -Encoding ascii, which
          # would leave a trailing `r on the filename field and break `sha256sum -c`
          # on Linux/WSL (the verification path README.md documents). Write LF
          # explicitly so the checksum file is portable across platforms.
          $sha = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "SHA256SUMS-$assetArch.txt"),
            "$sha  $zipName`n",
            [System.Text.Encoding]::ASCII)

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syncwingetlink-${{ matrix.platform }}
          path: |
            syncwingetlink-*.zip
            SHA256SUMS-*.txt

  publish:
    name: Publish draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts

      - name: Combine checksums
        run: |
          find release-artifacts -name 'SHA256SUMS-*.txt' -print0 | sort -z | xargs -0 cat > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-artifacts/**/syncwingetlink-*.zip
            SHA256SUMS.txt
