name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} release binary
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
          - platform: ARM64

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Build release binary
        run: msbuild syncwingetlink.sln -m:1 /nr:false -p:Configuration=Release -p:Platform=${{ matrix.platform }}

      - name: Stage release asset
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $assetArch = "${{ matrix.platform }}".ToLowerInvariant()

          $stage = Join-Path $PWD "stage"
          $stageDocs = Join-Path $stage "docs"
          New-Item -ItemType Directory -Force -Path $stageDocs | Out-Null

          $source = Join-Path $PWD "build\${{ matrix.platform }}\Release\syncwingetlink.exe"
          Copy-Item -Path $source -Destination (Join-Path $stage "syncwingetlink.exe") -Force

          $docs = @(
            "README.md",
            "README_ja.md",
            "docs\rules.md",
            "docs\rules_ja.md",
            "docs\troubleshooting.md",
            "docs\troubleshooting_ja.md"
          )
          foreach ($doc in $docs) {
            if (-not (Test-Path -LiteralPath $doc)) {
              throw "Release doc not found: $doc"
            }
            Copy-Item -LiteralPath $doc -Destination $stageDocs -Force
          }

          $zipName = "syncwingetlink-$version-$assetArch.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipName -Force

          $sha = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $zipName" | Out-File -FilePath "SHA256SUMS-$assetArch.txt" -Encoding ascii

      - name: Upload release artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: syncwingetlink-${{ matrix.platform }}
          path: |
            syncwingetlink-*.zip
            SHA256SUMS-*.txt

  publish:
    name: Publish draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@7a1cd3216ca9260cd8022db641d960b1db4d1be4
        with:
          path: release-artifacts

      - name: Combine checksums
        run: |
          find release-artifacts -name 'SHA256SUMS-*.txt' -print0 | sort -z | xargs -0 cat > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish draft release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-artifacts/**/syncwingetlink-*.zip
            SHA256SUMS.txt
