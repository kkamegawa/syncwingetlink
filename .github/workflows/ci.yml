name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.platform }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            configuration: Release
            runner: windows-latest
          - platform: ARM64
            configuration: Release
            # docs/adr-phase-9.md ADR-0046: the only hosted runner image that ships
            # PlatformToolset v145 (VS2026) on arm64. windows-11-arm is VS2022/v143 and
            # does not satisfy this repo's toolchain requirement.
            runner: windows-11-vs2026-arm

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Build ${{ matrix.platform }} / ${{ matrix.configuration }}
        run: msbuild syncwingetlink.sln -m:1 /nr:false -p:Configuration=${{ matrix.configuration }} -p:Platform=${{ matrix.platform }}

      - name: Test ${{ matrix.platform }} binaries
        shell: powershell
        run: |
          # docs/adr-phase-9.md ADR-0046: this now runs natively on both platforms -
          # the ARM64 leg executes on the windows-11-vs2026-arm hosted runner, so this
          # is a real test run, not a cross-compile-and-skip.
          $vswhereCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"),
            (Join-Path ${env:ProgramFiles} "Microsoft Visual Studio\Installer\vswhere.exe")
          ) | Where-Object { $_ -and (Test-Path $_) }

          if ($vswhereCandidates.Count -eq 0) {
            throw "vswhere.exe not found under Program Files or Program Files (x86)."
          }
          $vswhere = $vswhereCandidates[0]

          $vsInstallPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.PackageGroup.TestTools.Core -property installationPath
          if (-not $vsInstallPath) {
            $vsInstallPath = & $vswhere -latest -products * -property installationPath
          }
          if (-not $vsInstallPath) {
            throw "Visual Studio installation not found (vswhere returned empty)."
          }

          $vstestCandidates = @(
            (Join-Path $vsInstallPath "Common7\IDE\Extensions\TestPlatform\vstest.console.exe"),
            (Join-Path $vsInstallPath "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe")
          ) | Where-Object { Test-Path $_ }

          if ($vstestCandidates.Count -eq 0) {
            throw "vstest.console.exe not found under: $vsInstallPath"
          }

          & $vstestCandidates[0] "build\${{ matrix.platform }}\${{ matrix.configuration }}\syncwingetlink.tests.dll" /Platform:${{ matrix.platform }} /InIsolation
