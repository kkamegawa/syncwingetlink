name: Microsoft C++ Code Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '41 16 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build with MSVC Code Analysis enabled
        run: >
          msbuild syncwingetlink.sln -m:1 /nr:false
          -p:Configuration=Debug
          -p:Platform=x64
          -p:RunCodeAnalysis=true
          -p:EnableMicrosoftCodeAnalysis=true
          -p:MicrosoftCodeAnalysisRuleset=NativeRecommendedRules.ruleset

      # Upload SARIF files generated by MSBuild code analysis to GitHub Code Scanning.
      # RunCodeAnalysis=true enables the analysis pass (adds /analyze to CL.exe and
      # writes *.CodeAnalysisLog.sarif into each project's intermediate directory).
      # EnableMicrosoftCodeAnalysis=true selects the Microsoft native ruleset.
      # Together they cause MSVC to emit *.sarif files into build\obj\**\*.sarif.
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: build/obj
          category: msvc-code-analysis

      # Upload SARIF file as an Artifact to download and view
      # - name: Upload SARIF as an Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: sarif-file
      #     path: build/obj
