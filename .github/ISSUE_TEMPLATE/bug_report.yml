name: Bug report
description: Report a problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please provide as much detail as possible to help us reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Briefly describe the problem.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The commands and steps you ran.
      placeholder: |
        1. Run `syncwingetlink scan`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages / logs if any.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste `winget --info` output, Windows version, and architecture.
      placeholder: |
        - syncwingetlink version:
        - Windows: 11 24H2 (build 26100)
        - Architecture: x64 / arm64
        - Developer Mode: enabled / disabled
      render: shell
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false
