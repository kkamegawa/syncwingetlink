# SPDX-License-Identifier: MIT
#
# NOTE: native dependencies are managed with vcpkg (see docs/adr.md ADR-0007), and
# **Dependabot does not support the vcpkg ecosystem** -- GitHub's dependency graph does
# not parse vcpkg.json either. There is deliberately no entry for it below; adding one
# would be silently ineffective and would give a false sense of coverage.
#
# Until a scanner that understands vcpkg is wired into CI (adr.md open item 6), native
# dependency vulnerabilities are checked MANUALLY: pin builtin-baseline in vcpkg.json,
# and review advisories for the exact port version whenever a port is added or the
# baseline is rolled. See the cpp-msbuild skill, section 5.
version: 2

updates:
  # GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
